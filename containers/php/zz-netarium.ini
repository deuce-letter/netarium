date.timezone = Asia/Tokyo
display_errors = Off
expose_php = Off
log_errors = On
error_log = /proc/self/fd/2
file_uploads = On
upload_max_filesize = 32M
post_max_size = 34M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
