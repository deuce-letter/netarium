server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    server_tokens off;

    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 300s;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header X-Frame-Options;
    }

    location ~* \.(?:sqlite|db|log|bak|zip)$ {
        deny all;
    }

    location ~* /(db|uploads|backups|temp|logs|scripts|tests|src)(?:/|$) {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /web.config {
        deny all;
    }
}
